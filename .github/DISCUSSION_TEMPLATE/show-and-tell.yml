body:
  - type: markdown
    attributes:
      value: |
        Share a model, rule pack, integration, or workflow built with Threat Model Forge.
        This is public: use synthetic or sanitized examples and share only content you have permission to publish.
        Do not include secrets, personal information, or confidential architecture. Report suspected vulnerabilities [privately](https://github.com/Hacks4Snacks/tmforge/security/advisories/new).
  - type: textarea
    id: showcase
    attributes:
      label: What did you build or try?
      description: Describe the problem, the intended audience, and how tmforge fits into your workflow.
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: How it works
      description: Include the interfaces, model formats, and versions used. Distinguish model assumptions from controls you have verified.
  - type: textarea
    id: artifacts
    attributes:
      label: Examples and links
      description: Share a public repository, synthetic model, rule pack, or sanitized screenshot. A Studio share link contains the model itself; anyone with the link can read it.
  - type: textarea
    id: lessons
    attributes:
      label: What did you learn?
      description: What worked, what was difficult, and what would help someone trying the same approach?
  - type: textarea
    id: feedback
    attributes:
      label: Feedback you would like
      description: Name the parts you would like others to discuss or review. Sharing a model does not establish that the modeled system is secure.
