name: Bug report
description: Report broken behavior in Threat Model Forge.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        For usage questions, use [Q&A](https://github.com/Hacks4Snacks/tmforge/discussions/categories/q-a).
        Report suspected vulnerabilities through [private vulnerability reporting](https://github.com/Hacks4Snacks/tmforge/security/advisories/new), not this public form.
        Search existing issues before opening a duplicate. Include only sanitized logs, screenshots, and models.
  - type: dropdown
    id: interface
    attributes:
      label: Affected interface
      multiple: true
      options:
        - Browser Studio (local WASM engine)
        - Browser Studio (HTTP engine)
        - VS Code extension
        - CLI
        - HTTP API
        - MCP server
        - Copilot plugin (Strider)
        - GitHub Action
        - Documentation
        - Other or unsure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include tmforge --version, the extension/plugin version, or the container tag/digest. For the hosted demo, include its URL and when you observed the issue; say if the version is unknown.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS and architecture, browser or VS Code version, installation method, and local/remote development where relevant. Identify any custom rule packs without exposing private paths or content.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the smallest sequence of commands or UI actions that demonstrates the problem. Note whether it also occurs on the latest stable release, if tested.
      placeholder: |
        1. Open or create ...
        2. Run or select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the error message, exit code, or rule ID where relevant. For lost or changed data, describe what changed without including confidential content.
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: Minimal model or example
      description: State the source format and any conversion target. Paste a small synthetic example or attach a sanitized file. If GitHub rejects the extension, use a ZIP or a .txt copy and state the original extension. If you cannot share a safe reproducer, explain the limitation.
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove credentials, tokens, private URLs, personal information, and confidential architecture. Attach sanitized screenshots in the example field above.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Public report checklist
      options:
        - label: I have reviewed the report and attachments and removed secrets, personal information, and confidential model content.
          required: true
