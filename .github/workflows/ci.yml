name: ci

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plugin:
    name: Copilot plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate plugin and portable scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B -m unittest discover -s test/plugin -v

  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.301

      - name: Build
        run: dotnet build dirs.proj -c Release

      - name: Test
        run: >
          dotnet test dirs.proj -c Release --no-build
          --collect:"XPlat Code Coverage" --results-directory TestResults/coverage

      # Coverage is a ratchet, not a target: the floors in build/coverage-floors.json sit just under
      # the numbers at the time they were recorded, so an unrelated change cannot trip them while a
      # real regression still fails the build. Raise a floor when coverage improves.
      - name: Coverage floors
        run: python3 build/coverage-summary.py --results TestResults/coverage

  studio:
    name: Studio build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ThreatModelForge.Studio
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/ThreatModelForge.Studio/package-lock.json

      - name: Install
        run: npm ci

      - name: Test (type-check + Vitest)
        run: npm test

      # Thresholds live in vite.config.ts alongside the rest of the Vitest setup.
      - name: Coverage floors
        run: npm run coverage

      - name: Build (production bundle)
        run: npm run build

  wasm:
    name: WASM engine build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.301

      # The browser-wasm project is opt-in (BuildWasm) and excluded from dirs.proj,
      # so publish it directly. This catches interop signature drift and trimming
      # regressions that the default build/test never exercises.
      - name: Install WASM workloads
        run: dotnet workload install wasm-tools wasm-experimental

      - name: Publish WASM engine (Release, trimmed)
        run: dotnet publish src/ThreatModelForge.Wasm/ThreatModelForge.Wasm.csproj -c Release -o artifacts/wasm

      - name: Assert trimmed bundle manifest
        run: |
          set -euo pipefail
          fw=artifacts/wasm/wwwroot/_framework
          need() { test -f "$fw/$1" || { echo "::error::$1 missing from WASM bundle ($2)"; exit 1; }; }
          need dotnet.js "runtime host"
          need ThreatModelForge.Wasm.wasm "JSExport interop layer"
          # Engine assemblies must survive trimming (rooted via ILLink.Descriptors.xml).
          for a in Core Editing Formats Analysis Analysis.Rules Reporting Engine; do
            need "ThreatModelForge.$a.wasm" "engine assembly trimmed away"
          done
          # .tm7 round-trip (DataContractSerializer) and DTO IO (System.Text.Json) must stay wired.
          need System.Private.DataContractSerialization.wasm ".tm7 serialization"
          need System.Text.Json.wasm "DTO JSON serialization"
          echo "WASM bundle OK: $(ls "$fw"/*.wasm | wc -l | tr -d ' ') assemblies"

  containers:
    name: Container build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build CLI image (amd64, load)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/Dockerfile
          load: true
          tags: tmforge-cli:ci
          cache-from: type=gha,scope=tmforge-cli
          cache-to: type=gha,mode=max,scope=tmforge-cli

      - name: Smoke test CLI (tmforge --version)
        run: docker run --rm tmforge-cli:ci --version

      - name: Build API image (amd64, load)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/Dockerfile.api
          load: true
          tags: tmforge:ci
          cache-from: type=gha,scope=tmforge
          cache-to: type=gha,mode=max,scope=tmforge

      - name: Smoke test API (/v1/health)
        run: |
          set -euo pipefail
          docker run -d --name tmforge-api -p 8080:8080 tmforge:ci
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/v1/health >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 2
          done
          docker logs tmforge-api || true
          if [ "$ok" -ne 1 ]; then
            echo "::error::tmforge API did not become healthy on /v1/health"
            exit 1
          fi
          echo "Smoke test passed:"
          curl -fsS http://127.0.0.1:8080/v1/health

      - name: Cleanup
        if: always()
        run: docker rm -f tmforge-api || true

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    # PR-only supply-chain check; needs the repo Dependency Graph (on by default for
    # public repos). Flags newly introduced vulnerable dependencies.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  dogfood:
    name: Analyze sample models
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.301

      - name: Publish CLI
        run: dotnet publish src/ThreatModelForge.Cli/ThreatModelForge.Cli.csproj -c Release -o artifacts/cli

      # Run the tool against the sample threat models the repo ships under examples/: proof the CLI
      # loads and analyzes real .tm7 files, and the reference usage for the first-party action.
      # Findings are advisory (analyze exits 2 only when findings reach the error threshold); exit 0
      # or 2 both pass — only a model the tool cannot analyze at all (exit 1 / crash) is a failure.
      - name: Analyze the sample threat models
        run: |
          set -uo pipefail
          shopt -s globstar nullglob
          mkdir -p artifacts/sarif
          models=( examples/**/*.tm7 )
          if [ ${#models[@]} -eq 0 ]; then
            echo "::error::No sample .tm7 models found under examples/ to dogfood."
            exit 1
          fi
          rc=0
          for model in "${models[@]}"; do
            echo "::group::tmforge analyze $model"
            code=0
            dotnet artifacts/cli/tmforge.dll analyze "$model" --reportFolder artifacts/sarif || code=$?
            echo "::endgroup::"
            case "$code" in
              0) echo "clean: $model" ;;
              2) echo "findings: $model" ;;
              *) echo "::error::tmforge could not analyze $model (exit $code)."; rc=1 ;;
            esac
          done
          exit $rc

      - name: Upload SARIF reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sample-model-sarif
          path: artifacts/sarif
          if-no-files-found: warn

  action:
    name: First-party action
    runs-on: ubuntu-latest
    # Executes action.yml itself against a locally built image. Without this job the action is only
    # ever exercised by consumers, so a change to its inputs or shell wiring regresses silently.
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # A YAML parse cannot catch this: the file stays valid YAML, but GitHub parses expressions
      # everywhere in a step - including inside a run script's shell comments - and an empty one
      # fails the whole action to load. Checked before the image build so the failure is fast and
      # names the cause. The pattern is escaped so this check is not itself read as an expression.
      - name: Reject empty expressions in the action manifest
        run: |
          if grep -nE '\$\{\{[[:space:]]*\}\}' action.yml; then
            echo "::error file=action.yml::Empty GitHub expression. The action will fail to load with 'An expression was expected'."
            exit 1
          fi

      - name: Build CLI image (amd64, load)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: build/Dockerfile
          load: true
          tags: tmforge-cli:ci
          cache-from: type=gha,scope=tmforge-cli
          cache-to: type=gha,mode=max,scope=tmforge-cli

      # The example custom rule reports an error on the sample model, so the action must gate on it.
      - name: Action reports the custom-rule finding
        id: findings
        uses: ./
        with:
          models: examples/webshop.tm7
          image: tmforge-cli
          version: ci
          pull: "false"
          rules: examples/corporate-policy.tmrules.json
          upload-sarif: "false"
          fail-on-findings: "false"
          sarif-directory: .tmforge-findings

      # The suppression silences exactly that finding, so the same inputs must now clear the gate.
      - name: Action passes once the finding is suppressed
        id: suppressed
        uses: ./
        with:
          models: examples/webshop.tm7
          image: tmforge-cli
          version: ci
          pull: "false"
          rules: examples/corporate-policy.tmrules.json
          suppression-file: examples/corporate-policy.suppressions.json
          upload-sarif: "false"
          upload-report: "true"
          report-artifact-name: action-findings-report
          sarif-directory: .tmforge-suppressed

      - name: Action outcome matches the CLI
        env:
          FINDINGS_RESULT: ${{ steps.findings.outputs.result }}
          FINDINGS_CODE: ${{ steps.findings.outputs.exit-code }}
          SUPPRESSED_RESULT: ${{ steps.suppressed.outputs.result }}
          SUPPRESSED_CODE: ${{ steps.suppressed.outputs.exit-code }}
        run: |
          set -uo pipefail
          run_cli() {
            docker run --rm -v "$PWD":/work -w /work tmforge-cli:ci analyze "$@" >/dev/null 2>&1
            echo $?
          }
          cli_findings=$(run_cli examples/webshop.tm7 \
            --rules examples/corporate-policy.tmrules.json --reportFolder .cli-findings)
          cli_suppressed=$(run_cli examples/webshop.tm7 \
            --rules examples/corporate-policy.tmrules.json \
            --suppressionFile examples/corporate-policy.suppressions.json --reportFolder .cli-suppressed)

          echo "action: findings=$FINDINGS_RESULT/$FINDINGS_CODE suppressed=$SUPPRESSED_RESULT/$SUPPRESSED_CODE"
          echo "cli:    findings=$cli_findings suppressed=$cli_suppressed"

          rc=0
          if [ "$FINDINGS_CODE" != "2" ] || [ "$FINDINGS_RESULT" != "fail" ]; then
            echo "::error::Expected the custom rule to gate (fail/2), got $FINDINGS_RESULT/$FINDINGS_CODE."
            rc=1
          fi
          if [ "$SUPPRESSED_CODE" != "0" ] || [ "$SUPPRESSED_RESULT" != "pass" ]; then
            echo "::error::Expected the suppression to clear the gate (pass/0), got $SUPPRESSED_RESULT/$SUPPRESSED_CODE."
            rc=1
          fi
          if [ "$cli_findings" != "$FINDINGS_CODE" ]; then
            echo "::error::CLI ($cli_findings) and action ($FINDINGS_CODE) disagree without the suppression."
            rc=1
          fi
          if [ "$cli_suppressed" != "$SUPPRESSED_CODE" ]; then
            echo "::error::CLI ($cli_suppressed) and action ($SUPPRESSED_CODE) disagree with the suppression."
            rc=1
          fi
          exit $rc

      # A mistyped rule path must fail rather than analyze with the built-in rules and report clean.
      - name: Action rejects a missing rules path
        id: missing-rules
        continue-on-error: true
        uses: ./
        with:
          models: examples/webshop.tm7
          image: tmforge-cli
          version: ci
          pull: "false"
          rules: examples/no-such-pack.tmrules.json
          upload-sarif: "false"

      - name: Assert the missing rules path failed
        env:
          OUTCOME: ${{ steps.missing-rules.outcome }}
        run: |
          if [ "$OUTCOME" != "failure" ]; then
            echo "::error::A missing rules path must fail the action, not fall back to the built-in rules."
            exit 1
          fi
          echo "A missing rules path failed the action, as it must."

      # Drift is inert until the consumer names watched paths, and reports a reason either way.
      - name: Drift reports skipped when switched off
        id: drift-off
        uses: ./
        with:
          models: examples/webshop.tm7
          image: tmforge-cli
          version: ci
          pull: "false"
          upload-sarif: "false"
          drift: "off"
          sarif-directory: .tmforge-drift-off

      # Exercises the real change list for this event against globs nothing can have touched.
      - name: Drift reports no change against paths that did not change
        id: drift-clean
        uses: ./
        with:
          models: examples/webshop.tm7
          image: tmforge-cli
          version: ci
          pull: "false"
          upload-sarif: "false"
          drift-watched-paths: no-such-directory/**
          sarif-directory: .tmforge-drift-clean

      - name: Assert the drift contract
        env:
          OFF_DRIFT: ${{ steps.drift-off.outputs.drift }}
          CLEAN_DRIFT: ${{ steps.drift-clean.outputs.drift }}
          CLEAN_WATCHED: ${{ steps.drift-clean.outputs.drift-watched-count }}
          CLEAN_REASON: ${{ steps.drift-clean.outputs.drift-reason }}
        run: |
          echo "drift(off)=$OFF_DRIFT  drift(clean)=$CLEAN_DRIFT ($CLEAN_REASON)"
          rc=0
          if [ "$OFF_DRIFT" != "skipped" ]; then
            echo "::error::drift 'off' must report 'skipped', got '$OFF_DRIFT'."
            rc=1
          fi
          if [ "$CLEAN_DRIFT" != "false" ] || [ "$CLEAN_WATCHED" != "0" ]; then
            echo "::error::Watched paths that did not change must report 'false' with a zero count, got '$CLEAN_DRIFT'/'$CLEAN_WATCHED'."
            rc=1
          fi
          exit $rc

      # Exercises the review path against model globs no pull request can have touched, so the
      # assertion holds whatever this pull request happens to change.
      - name: Review reports no model changes against paths that did not change
        id: review
        if: github.event_name == 'pull_request'
        uses: ./
        with:
          models: examples/webshop.tm7
          image: tmforge-cli
          version: ci
          pull: "false"
          upload-sarif: "false"
          review: "on"
          drift-model-paths: no-such-directory/**
          sarif-directory: .tmforge-review

      - name: Assert the review contract
        if: github.event_name == 'pull_request'
        env:
          REVIEW: ${{ steps.review.outputs.review }}
          CHANGED: ${{ steps.review.outputs.review-changed-models }}
        run: |
          echo "review=$REVIEW changed-models=$CHANGED"
          if [ "$REVIEW" != "reviewed" ] || [ "$CHANGED" != "0" ]; then
            echo "::error::Expected 'reviewed' with zero changed models, got '$REVIEW'/'$CHANGED'."
            exit 1
          fi

